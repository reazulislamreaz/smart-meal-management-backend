services:
  postgres:
    image: postgres:17-alpine
    container_name: smart_meal_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_meal_db
    ports:
      # Host port (left) can change on the VPS; container still listens on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_meal_redis
    restart: always
    ports:
      # Host port (left) can change on the VPS; container still listens on 6379.
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_meal_backend
    restart: always
    ports:
      # Host port (left) is 8888 on the VPS; the app still listens on 3000 inside the container.
      - "${BACKEND_HOST_PORT:-8888}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/smart_meal_db?schema=public&sslmode=disable"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: ${APP_URL:-https://reaz3000.syedbipul.me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
