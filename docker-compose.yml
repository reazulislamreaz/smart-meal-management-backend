services:
  postgres:
    image: postgres:17-alpine
    container_name: smart_meal_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_meal_db}
    ports:
      # Bound to loopback only: the backend reaches postgres over the compose
      # network, so publishing this to 0.0.0.0 exposed the database to the
      # internet. Use an SSH tunnel for remote admin access.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_meal_redis
    restart: always
    ports:
      # Loopback only — Redis has no password and must never be internet facing.
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_meal_backend
    restart: always
    ports:
      # Host port (left) is 8888 on the VPS; the app still listens on 3000 inside the container.
      - "${BACKEND_HOST_PORT:-8888}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # POSTGRES_PASSWORD must be URL-safe (no @ : / ? # % characters), since it
      # is interpolated directly into this connection URL.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_meal_db}?schema=public&sslmode=disable"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: ${APP_URL:-https://reaz3000.syedbipul.me}
    depends_on:
      db-credentials-sync:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Keeps the postgres role password aligned with POSTGRES_PASSWORD on every
  # deploy. POSTGRES_PASSWORD alone only applies when the data volume is first
  # initialised, so without this the app and database drift apart and every
  # query fails with "authentication failed".
  db-credentials-sync:
    image: postgres:17-alpine
    container_name: smart_meal_db_credentials_sync
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/sync-db-credentials.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_socket:/var/run/postgresql
      - ./scripts:/scripts:ro

volumes:
  postgres_data:
  postgres_socket:
  redis_data:
